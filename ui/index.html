<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ShortFilm · SenseAudio 短片生成</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Segoe UI","Microsoft YaHei",sans-serif; background:#0f1115; color:#e6e8ee; }
  header { padding:14px 20px; background:#151821; border-bottom:1px solid #232838; display:flex; gap:12px; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .spacer { flex:1; }
  main { padding:20px; display:grid; grid-template-columns: 400px 1fr; gap:20px; max-width:1400px; margin:0 auto; }
  .card { background:#151821; border:1px solid #232838; border-radius:10px; padding:16px; }
  .card h2 { font-size:13px; margin:0 0 12px; color:#9aa3b5; text-transform:uppercase; letter-spacing:.5px; }
  label { display:block; font-size:12px; color:#9aa3b5; margin:10px 0 4px; }
  input[type=text], textarea, select {
    width:100%; background:#0f1115; border:1px solid #2a3042; color:#e6e8ee;
    border-radius:6px; padding:8px 10px; font-size:13px; font-family:inherit;
  }
  textarea { resize:vertical; min-height:64px; }
  button {
    background:#4f7cff; color:#fff; border:0; border-radius:6px; padding:8px 14px;
    font-size:13px; cursor:pointer; margin:4px 4px 4px 0;
  }
  button:hover { background:#3d6aef; }
  button:disabled { background:#2a3042; color:#7a8194; cursor:not-allowed; }
  button.ghost { background:#232838; }
  button.success { background:#2ea86b; }
  button.warn { background:#b8862e; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .shot { border:1px solid #232838; border-radius:8px; padding:10px; margin-bottom:10px; background:#11141c; }
  .shot.current { border-color:#4f7cff; }
  .shot.locked { opacity:.75; }
  .shot .head { display:flex; gap:8px; align-items:center; font-size:12px; color:#9aa3b5; }
  .badge { padding:2px 8px; border-radius:10px; font-size:11px; }
  .badge.pending { background:#2a3042; color:#9aa3b5; }
  .badge.running { background:#4f7cff; color:#fff; }
  .badge.done { background:#2ea86b; color:#fff; }
  .badge.failed { background:#d64545; color:#fff; }
  #log { font-family:Consolas,monospace; font-size:11px; height:140px; overflow-y:auto;
         background:#0a0c10; border:1px solid #232838; border-radius:6px; padding:8px; margin-top:10px; }
  .ref-imgs { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .ref-imgs .tag { background:#232838; border-radius:4px; padding:2px 6px; font-size:11px; color:#9aa3b5; cursor:pointer; }
  #shotPreview video, #shotPreview img { width:100%; max-height:320px; border-radius:8px; margin-top:8px; object-fit:contain; }
  .muted { color:#7a8194; font-size:12px; }
  .step { font-size:11px; background:#2a3042; padding:2px 8px; border-radius:10px; color:#9aa3b5; }
  .inherit { font-size:11px; color:#5a9cff; margin-left:6px; }
</style>
</head>
<body>
<header>
  <h1>🎬 ShortFilm</h1>
  <span class="muted">SenseAudio · Seedance 2.0 · 渐进式逐镜工作流</span>
  <div class="spacer"></div>
  <button class="ghost" id="btnKey">API Key</button>
</header>
<main>
  <section>
    <div class="card">
      <h2>1. 故事设定</h2>
      <label>片名</label>
      <input type="text" id="title" value="我的短片">
      <label>故事梗概</label>
      <textarea id="synopsis" placeholder="例如：女孩在毕业前夜，回到童年老宅，与记忆中的自己和解。"></textarea>
      <label>人物（每行：名字 | 外观描述 | 音色(可选)）</label>
      <textarea id="characters" placeholder="小雨 | 二十岁女生，黑色长发，米色风衣 | tongtong&#10;阿远 | 二十岁男生，短碎发，白色卫衣"></textarea>
      <div class="row">
        <div><label>建议镜头数</label><input type="text" id="shotCount" value="10"></div>
        <div><label>单镜秒数</label><input type="text" id="shotSeconds" value="6"></div>
      </div>
      <div class="row">
        <div>
          <label>宽高比（视频）</label>
          <select id="ratio">
            <option value="9:16" selected>9:16 竖屏</option>
            <option value="16:9">16:9 横屏</option>
            <option value="1:1">1:1</option>
          </select>
        </div>
        <div>
          <label>分辨率</label>
          <select id="resolution">
            <option value="720p" selected>720p</option>
            <option value="1080p">1080p</option>
            <option value="480p">480p</option>
          </select>
        </div>
      </div>
      <label>BGM 风格（可选，最后合并时生成）</label>
      <input type="text" id="music" placeholder="轻柔钢琴曲，安静治愈">
      <div style="margin-top:12px">
        <button class="ghost" id="btnRefreshModels">↻ 刷新模型</button>
        <div class="row" style="margin-top:8px">
          <div><label>LLM</label><select id="llmModel"></select></div>
          <div><label>分镜图模型</label><select id="imageModel"></select></div>
        </div>
        <div class="row">
          <div><label>视频模型</label><select id="videoModel"></select></div>
          <div><label>分镜图尺寸（实测可用）</label><select id="imageSize">
            <option value="1024x1536">1024x1536 竖屏</option>
            <option value="1024x1024">1024x1024 方形</option>
            <option value="1536x1024">1536x1024 横屏</option>
          </select></div>
        </div>
      </div>
      <div style="margin-top:12px">
        <button id="btnStoryboard">① 生成分镜表</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <h2>操作</h2>
      <div>
        <button id="btnGenerateNext" disabled>② 生成下一镜</button>
        <button id="btnApprove" class="success" disabled>③ 通过，继续下一镜</button>
        <button id="btnRetry" class="warn" disabled>重试本镜</button>
      </div>
      <div class="muted" style="margin-top:6px">逐镜确认：生成 → 你看效果满意点「通过」→ 再生成下一镜。不满意点「重试」（可先改提示词/参考图/角色）。全部通过后「合并成片」才开始 ffmpeg 汇总。</div>
      <div>
        <button id="btnAssemble" disabled>④ 合并成片</button>
      </div>
      <div id="log"></div>
    </div>
  </section>

  <section>
    <div class="card">
      <h2>当前镜头编辑 <span id="shotStep" class="step"></span></h2>
      <div id="shotEditor"><div class="muted">点击「生成分镜表」后开始。</div></div>
    </div>
    <div class="card" id="shotPreviewCard" style="margin-top:14px">
      <h2>本镜预览</h2>
      <div id="shotPreview"><div class="muted">生成后预览分镜图 / 视频。</div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <h2>镜头进度</h2>
      <div id="shots"><div class="muted">-</div></div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
