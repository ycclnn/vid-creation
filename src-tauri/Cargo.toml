[package]
name = "shortfilm"
version = "0.1.0"
description = "SenseAudio 短片生成工具：故事梗概 + 人物图 → 自动分镜、生视频、配音、拼接"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
base64 = "0.22"
anyhow = "1"

[profile.release]
strip = true
lto = true
